ca, sans-serif" font-size="18" font-weight="bold" text-anchor="start">December: 2024 0.72°C · actual</text><text x="20" y="576" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start">If Oct–Dec repeats 2023: 2026 0.67–0.68°C</text><text x="20" y="606" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Annual gap in that scenario: less than 0.05°C.</text><text x="20" y="632" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start">Faint envelopes: day-weighting sensitivity, not statistical uncertainty.</text><text x="20" y="665" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Data: C3S/ECMWF, ERA5 · September 2026 bulletin snapshot</text><text x="20" y="684" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Calculations: DataHub · Modified Copernicus Climate Change Service information 2026.</text></svg>
