# Runs the Commons dataset standard on every push and pull request.
# Standard: https://github.com/datasets/datapressr/blob/main/docs/dataset-standard.md
name: dataset-check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dataset
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the checker and the MDX compiler DataHub uses
        run: |
          base=https://raw.githubusercontent.com/datasets/datapressr/main
          mkdir -p checker/scripts checker/site/stories
          for f in scripts/dataset-check.mjs scripts/validate-datapackage.mjs site/stories/mdx-check.mjs; do
            curl -fsSL "$base/$f" -o "checker/$f"
          done
          npm install --silent --no-save --prefix checker/site/stories @mdx-js/mdx@3.1.1 remark-gfm@4.0.1 remark-math@6.0.0
      - name: Check
        run: node checker/scripts/dataset-check.mjs dataset --new --name "${GITHUB_REPOSITORY#*/}"
