<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
<title id="t">U.S. weather deaths per year from heat, tornadoes and flash floods, 1997–2025</title>
<desc id="d">Line chart of deaths per year attributed by the National Weather Service to heat, tornadoes and flash floods, the three deadliest event types over 1997–2025. Heat is the deadliest of the three in most years and was far higher in 2020–2024 than before; the preliminary 2025 figure is lower.</desc>
<rect width="820" height="440" fill="#fcfcfb"/>
<text x="56" y="30" font-size="17" font-weight="600" fill="#0b0b0b">Heat is the deadliest U.S. weather hazard in most years</text>
<text x="56" y="52" font-size="13" fill="#52514e">Deaths per year from the three event types with the most deaths over 1997–2025.</text>
<text x="56" y="70" font-size="13" fill="#52514e">Source: NWS annual Summary of U.S. Natural Hazard Statistics (Storm Data). 2025 is preliminary.</text>
