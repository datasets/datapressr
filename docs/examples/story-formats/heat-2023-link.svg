<svg xmlns="http://www.w3.org/2000/svg" data-dp-card="link" role="img" aria-labelledby="heat-2023-link-title heat-2023-link-desc" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#111827"><title id="heat-2023-link-title">US heat deaths in 2023 were 3.5 times the norm</title><desc id="heat-2023-link-desc">Column chart: US heat deaths reached 555 in 2023, the most in 1997–2025 and 3.5 times the 1997–2022 average of 161. Source: National Weather Service.</desc><rect width="1200" height="630" fill="#ffffff"></rect><line class="dp-rule" x1="72" x2="1128" y1="446.5" y2="446.5" stroke="#e5e7eb" stroke-width="2"></line><rect class="dp-mark" x="867.6" y="531" width="28" height="28" rx="6" fill="#1d4ed8"></rect><text class="dp-title" x="72" y="126.4" font-size="64" fill="#111827" font-weight="700">US heat deaths in 2023 were</text><text class="dp-title" x="72" y="198.1" font-size="64" fill="#111827" font-weight="700">3.5 times the norm</text><text class="dp-hero" x="72" y="414.1" font-size="200" fill="#1d4ed8" font-weight="800">555</text><text class="dp-source" x="72" y="510.5" font-size="38" fill="#6b7280" font-weight="400">Source: US National Weather Service,</text><text class="dp-source" x="72" y="558.0" font-size="38" fill="#6b7280" font-weight="400">1997–2025 (2025 preliminary)</text><text class="dp-mark" x="1128" y="558.0" font-size="38" fill="#111827" font-weight="700" text-anchor="end">datahub.io</text></svg>
