<svg xmlns="http://www.w3.org/2000/svg" data-dp-card="portrait" role="img" aria-labelledby="heat-vs-tornadoes-portrait-title heat-vs-tornadoes-portrait-desc" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#111827"><title id="heat-vs-tornadoes-portrait-title">Heat killed 2.5 times as many Americans as tornadoes</title><desc id="heat-vs-tornadoes-portrait-desc">Bar chart: heat killed 5,366 people in the US in 1997–2025, 2.5 times the 2,167 killed by tornadoes, in the same National Weather Service count.</desc><rect width="1080" height="1350" fill="#ffffff"></rect><line class="dp-rule" x1="72" x2="1008" y1="1175.5" y2="1175.5" stroke="#e5e7eb" stroke-width="2"></line><rect class="dp-mark" x="770.8" y="1251" width="28" height="28" rx="6" fill="#1d4ed8"></rect><text class="dp-title" x="72" y="136.6" font-size="76" fill="#111827" font-weight="700">Heat killed 2.5 times</text><text class="dp-title" x="72" y="221.7" font-size="76" fill="#111827" font-weight="700">as many Americans as</text><text class="dp-title" x="72" y="306.8" font-size="76" fill="#111827" font-weight="700">tornadoes</text><text class="dp-hero" x="72" y="609.2" font-size="280" fill="#1d4ed8" font-weight="800">2.5×</text><text class="dp-hero-label" x="72" y="680.9" font-size="44" fill="#111827" font-weight="400">Both are weather-service death counts,</text><text class="dp-hero-label" x="72" y="734.6" font-size="44" fill="#111827" font-weight="400">1997–2025</text><text class="dp-source" x="72" y="1235.5" font-size="34" fill="#6b7280" font-weight="400">Source: US National Weather Service,</text><text class="dp-source" x="72" y="1278.0" font-size="34" fill="#6b7280" font-weight="400">1997–2025 (2025 preliminary)</text><text class="dp-mark" x="1008" y="1278.0" font-size="34" fill="#111827" font-weight="700" text-anchor="end">datahub.io</text><svg class="plot-d6a7b5" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="936" height="402" viewBox="0 0 936 402" style="font-size: 44px; font-family: ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; background: rgb(255, 255, 255); color: rgb(17, 24, 39);" x="72" y="749"><style>:where(.plot-d6a7b5) {
